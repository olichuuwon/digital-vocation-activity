name: Live security check
# Checks the deployed site: security headers, and that Supabase migration 0005 is applied.
# Read-only (writes nothing). Run it from the Actions tab, or it runs every Monday.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * 1'

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node e2e-live/security-check.mjs
